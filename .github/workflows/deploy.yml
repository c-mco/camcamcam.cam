name: Build Check

# Deployment is handled by Cloudflare's Git integration (Workers Builds),
# which builds and publishes camcamcam.cam on every push to main.
# This workflow only verifies that the site, PDF and DOCX still build.

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Website, PDF & DOCX
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Build Everything (DOCX + Site + PDF)
        run: npm run build

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: site-dist
          path: dist/
